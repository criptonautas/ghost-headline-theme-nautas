name: Sync mushin

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mushin

jobs:
  sync:
    runs-on: ubuntu-latest
    # Off until the mushin collection and its key exist; see the script header.
    if: vars.HISTER_URL != ''

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mirror Hister's global documents into Typesense
        env:
          HISTER_URL: ${{ vars.HISTER_URL }}
          TYPESENSE_URL: https://typesense.criptonautas.co
          TYPESENSE_MUSHIN_KEY: ${{ secrets.TYPESENSE_MUSHIN_KEY }}
        run: python3 .github/scripts/mushin_sync.py
